<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Kontak | Analisis Efisiensi Algoritma</title>
  <link rel="stylesheet" href="contactstyle.css" />
</head>
<body>

  <!-- Header -->
  <header>
    <h1>Kontak Kami</h1>
  </header>

  <!-- Navbar -->
  <nav>
    <a href="home.html">Beranda</a>
    <a href="analisis.html">Analisis Algoritma</a>
    <a href="graphic.html">Grafik Analisis</a>
    <a href="contact.html">Kontak</a> <!-- Link ke halaman Kontak -->
  </nav>

  <!-- Main Content: Form Kontak -->
  <div class="main-content">
    <div class="contact-form">
      <h2>Hubungi Kami</h2>
      <form id="contactForm">
        <label for="name">Nama Anda:</label>
        <input type="text" id="name" name="name" required placeholder="Masukkan nama Anda">

        <label for="email">Email Anda:</label>
        <input type="email" id="email" name="email" required placeholder="Masukkan email Anda">

        <label for="message">Pesan Anda:</label>
        <textarea id="message" name="message" required placeholder="Masukkan pesan Anda"></textarea>

        <button type="submit">Kirim Pesan</button>
      </form>
    </div>
  </div>

  <!-- JavaScript untuk menangani pengiriman form -->
  <script src="contactscript.js"></script>

</body>
</html>
